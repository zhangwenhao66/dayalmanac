<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Timeline of Domestic Violence Awareness Month, 1978 to 2022</title>
  <desc id="desc">1978: NCADV forms out of a Civil Rights Commission hearing. 1981: NCADV declares the first Day of Unity. 1987: Day of Unity expands into a full month. 1989: Congress designates October 1989 by joint resolution, and Bush issues the first proclamation. 1996: A separate National Domestic Violence Hotline launches under the Violence Against Women Act. 2022: NCADV merges into the Hotline's parent organization.</desc>
  <rect width="1000" height="320" fill="#faf7f0" />

  <line x1="60" y1="160" x2="940" y2="160" stroke="#e2dbcc" stroke-width="2" />

  <!-- 1978 -->
  <circle cx="100" cy="160" r="7" fill="#5b6d45" />
  <text x="100" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d1a">1978</text>
  <text x="100" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="100" dy="0">NCADV forms after a</tspan>
    <tspan x="100" dy="15">Civil Rights Commission</tspan>
    <tspan x="100" dy="15">hearing on battered women</tspan>
  </text>

  <!-- 1981 -->
  <circle cx="260" cy="160" r="7" fill="#5b6d45" />
  <text x="260" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d1a">1981</text>
  <text x="260" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="260" dy="0">NCADV declares the</tspan>
    <tspan x="260" dy="15">first Day of Unity,</tspan>
    <tspan x="260" dy="15">a single October day</tspan>
  </text>

  <!-- 1987 -->
  <circle cx="420" cy="160" r="7" fill="#5b6d45" />
  <text x="420" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d1a">1987</text>
  <text x="420" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="420" dy="0">The day expands to a</tspan>
    <tspan x="420" dy="15">full month; NCADV runs</tspan>
    <tspan x="420" dy="15">its own hotline briefly</tspan>
  </text>

  <!-- 1989 -->
  <circle cx="580" cy="160" r="7" fill="#a8352b" />
  <text x="580" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d1a">1989</text>
  <text x="580" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="580" dy="0">Congress designates</tspan>
    <tspan x="580" dy="15">October 1989 by name;</tspan>
    <tspan x="580" dy="15">Bush issues proclamation</tspan>
  </text>

  <!-- 1996 -->
  <circle cx="740" cy="160" r="7" fill="#a8352b" />
  <text x="740" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d1a">1996</text>
  <text x="740" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="740" dy="0">A separate National</tspan>
    <tspan x="740" dy="15">DV Hotline launches</tspan>
    <tspan x="740" dy="15">under a 1994 federal law</tspan>
  </text>

  <!-- 2022 -->
  <circle cx="900" cy="160" r="7" fill="#2f4858" />
  <text x="900" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d1a">2022</text>
  <text x="900" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="900" dy="0">NCADV merges into</tspan>
    <tspan x="900" dy="15">the Hotline's parent</tspan>
    <tspan x="900" dy="15">organization</tspan>
  </text>

  <text x="500" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.55">
    <tspan x="500" dy="0">Green marks advocacy-led steps, red marks federal action. No single congressional act after 1989</tspan>
    <tspan x="500" dy="18">renews the observance; Presidents have simply kept proclaiming it every October since.</tspan>
  </text>
</svg>
