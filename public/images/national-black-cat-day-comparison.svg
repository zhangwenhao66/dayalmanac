<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Two black-cat observances, both launched in 2011</title>
  <desc id="desc">National Black Cat Day: launched October 27, 2011, by the UK charity Cats Protection, prompted by data showing black cats took seven days longer on average to be adopted. Black Cat Appreciation Day: launched August 17, 2011, by Wayne H. Morris in the United States, in memory of his sister and her black cat, Sinbad. Both campaigns continue today, under different organizations, on different dates, in different countries.</desc>
  <rect width="1200" height="630" fill="#faf7f0" />

  <text x="600" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#1f1d1a">Two campaigns, one launch year</text>
  <text x="600" y="102" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1f1d1a" opacity="0.6">Both began in 2011, for a similar reason, an ocean apart</text>

  <!-- divider -->
  <line x1="600" y1="140" x2="600" y2="560" stroke="#e2dbcc" stroke-width="2" />

  <!-- Left: UK -->
  <rect x="80" y="150" width="460" height="46" rx="4" fill="#2f4858" />
  <text x="310" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#faf7f0">National Black Cat Day</text>

  <text x="100" y="235" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1f1d1a">October 27, every year</text>
  <text x="100" y="265" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">Founded by Cats Protection,</text>
  <text x="100" y="285" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">a UK charity, on 27 October 2011</text>

  <text x="100" y="330" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">Prompted by shelter data: black</text>
  <text x="100" y="350" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">and black-and-white cats took 7</text>
  <text x="100" y="370" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">days longer, on average, to be</text>
  <text x="100" y="390" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">adopted than other-colored cats</text>

  <text x="100" y="435" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">Fictional mascot: Billy Noir-Mates</text>
  <text x="100" y="465" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">Still run by Cats Protection today,</text>
  <text x="100" y="485" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">via #BlackCatDay</text>

  <!-- Right: US -->
  <rect x="660" y="150" width="460" height="46" rx="4" fill="#5b6d45" />
  <text x="890" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#faf7f0">Black Cat Appreciation Day</text>

  <text x="680" y="235" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1f1d1a">August 17, every year</text>
  <text x="680" y="265" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">Founded by Wayne H. Morris,</text>
  <text x="680" y="285" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">a private individual, in 2011</text>

  <text x="680" y="330" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">A personal tribute: named for the</text>
  <text x="680" y="350" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">day his sister June, owner of a</text>
  <text x="680" y="370" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">black cat named Sinbad, died;</text>
  <text x="680" y="390" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">sources disagree on which year</text>

  <text x="680" y="435" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">Partner organization: Rikki's</text>
  <text x="680" y="465" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">Refuge Animal Sanctuary, Virginia</text>
  <text x="680" y="485" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">(fundraiser continues after Morris's 2022 death)</text>

  <text x="600" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1f1d1a" opacity="0.55">Same launch year, same rough goal, unrelated organizations</text>
</svg>
