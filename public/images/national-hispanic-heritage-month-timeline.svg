<svg viewBox="0 0 1160 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Timeline of National Hispanic Heritage Month, 1968 to 1998</title>
  <desc id="desc">June 1968: Rep. George E. Brown introduces H.J. Res. 1299 with 19 cosponsors, including Edward Roybal, Henry Gonzalez, and George H.W. Bush. September 1968: Johnson signs Public Law 90-498 and proclaims the first National Hispanic Heritage Week the same day. August 1988: Reagan signs Public Law 100-402, changing "week" to "month" in the 1968 law. September 1988: Reagan's own proclamation that month still cites only the old week-long law. September 1989: Bush, one of the 1968 cosponsors, issues the first Hispanic Heritage Month proclamation. 1998: the observance is recodified as 36 U.S.C. section 126.</desc>
  <rect width="1160" height="320" fill="#faf7f0" />

  <line x1="60" y1="160" x2="1100" y2="160" stroke="#e2dbcc" stroke-width="2" />

  <!-- 1968a -->
  <circle cx="100" cy="160" r="7" fill="#5b6d45" />
  <text x="100" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1f1d1a">
    <tspan x="100" dy="0">1968</tspan>
    <tspan x="100" dy="18" font-size="11" font-weight="400" opacity="0.7">June 11</tspan>
  </text>
  <text x="100" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="100" dy="0">Brown introduces</tspan>
    <tspan x="100" dy="15">H.J. Res. 1299 with</tspan>
    <tspan x="100" dy="15">19 cosponsors</tspan>
  </text>

  <!-- 1968b -->
  <circle cx="290" cy="160" r="7" fill="#5b6d45" />
  <text x="290" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1f1d1a">
    <tspan x="290" dy="0">1968</tspan>
    <tspan x="290" dy="18" font-size="11" font-weight="400" opacity="0.7">September 17</tspan>
  </text>
  <text x="290" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="290" dy="0">Johnson signs</tspan>
    <tspan x="290" dy="15">P.L. 90-498, proclaims</tspan>
    <tspan x="290" dy="15">first Heritage Week</tspan>
  </text>

  <!-- 1988a -->
  <circle cx="500" cy="160" r="7" fill="#5b6d45" />
  <text x="500" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1f1d1a">
    <tspan x="500" dy="0">1988</tspan>
    <tspan x="500" dy="18" font-size="11" font-weight="400" opacity="0.7">August 17</tspan>
  </text>
  <text x="500" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="500" dy="0">Reagan signs</tspan>
    <tspan x="500" dy="15">P.L. 100-402,</tspan>
    <tspan x="500" dy="15">"week" becomes "month"</tspan>
  </text>

  <!-- 1988b -->
  <circle cx="700" cy="160" r="7" fill="#a8352b" />
  <text x="700" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1f1d1a">
    <tspan x="700" dy="0">1988</tspan>
    <tspan x="700" dy="18" font-size="11" font-weight="400" opacity="0.7">September 13</tspan>
  </text>
  <text x="700" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="700" dy="0">Reagan's own</tspan>
    <tspan x="700" dy="15">proclamation still</tspan>
    <tspan x="700" dy="15">cites only the old law</tspan>
  </text>

  <!-- 1989 -->
  <circle cx="900" cy="160" r="7" fill="#a8352b" />
  <text x="900" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1f1d1a">
    <tspan x="900" dy="0">1989</tspan>
    <tspan x="900" dy="18" font-size="11" font-weight="400" opacity="0.7">September 14</tspan>
  </text>
  <text x="900" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="900" dy="0">Bush, a 1968</tspan>
    <tspan x="900" dy="15">cosponsor, issues the</tspan>
    <tspan x="900" dy="15">first month proclamation</tspan>
  </text>

  <!-- 1998 -->
  <circle cx="1060" cy="160" r="7" fill="#2f4858" />
  <text x="1060" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#1f1d1a">1998</text>
  <text x="1060" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="1060" dy="0">Recodified as</tspan>
    <tspan x="1060" dy="15">36 U.S.C.</tspan>
    <tspan x="1060" dy="15">section 126</tspan>
  </text>

  <text x="580" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.55">
    <tspan x="580" dy="0">Green marks congressional action, red marks a presidential proclamation. Twenty-one years</tspan>
    <tspan x="580" dy="18">separate Bush the cosponsor from Bush the President who finally proclaimed the month.</tspan>
  </text>
</svg>
