<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Timeline of National Taco Day, 1968 to 2026</title>
  <desc id="desc">1968: Congress recognizes a different National Taco Day, May 3, tied to a San Antonio civic group. 2000: Chuy's Tex-Mex trademark bid for June 12 is rejected. 2009: Del Taco's press release popularizes October 4. 2013: National Day Calendar formally registers October 4. 2024: Taco Bell and National Day Calendar move the date to the first Tuesday of October. 2026: Both October 4 and the first-Tuesday date still circulate online.</desc>
  <rect width="1000" height="320" fill="#faf7f0" />

  <line x1="60" y1="160" x2="940" y2="160" stroke="#e2dbcc" stroke-width="2" />

  <!-- 1968 -->
  <circle cx="100" cy="160" r="7" fill="#2f4858" />
  <text x="100" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d1a">1968</text>
  <text x="100" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="100" dy="0">Congress names a</tspan>
    <tspan x="100" dy="15">different Taco Day,</tspan>
    <tspan x="100" dy="15">May 3 — later abandoned</tspan>
  </text>

  <!-- 2000 -->
  <circle cx="260" cy="160" r="7" fill="#2f4858" />
  <text x="260" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d1a">2000</text>
  <text x="260" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="260" dy="0">Chuy's trademark bid</tspan>
    <tspan x="260" dy="15">for June 12 is rejected</tspan>
    <tspan x="260" dy="15">by the USPTO</tspan>
  </text>

  <!-- 2009 -->
  <circle cx="420" cy="160" r="7" fill="#5b6d45" />
  <text x="420" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d1a">2009</text>
  <text x="420" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="420" dy="0">Del Taco's press</tspan>
    <tspan x="420" dy="15">release popularizes</tspan>
    <tspan x="420" dy="15">October 4</tspan>
  </text>

  <!-- 2013 -->
  <circle cx="580" cy="160" r="7" fill="#a8352b" />
  <text x="580" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d1a">2013</text>
  <text x="580" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="580" dy="0">National Day Calendar</tspan>
    <tspan x="580" dy="15">formally registers</tspan>
    <tspan x="580" dy="15">October 4</tspan>
  </text>

  <!-- 2024 -->
  <circle cx="740" cy="160" r="7" fill="#a8352b" />
  <text x="740" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d1a">2024</text>
  <text x="740" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="740" dy="0">Taco Bell + registrar</tspan>
    <tspan x="740" dy="15">move it to the first</tspan>
    <tspan x="740" dy="15">Tuesday of October</tspan>
  </text>

  <!-- 2026 -->
  <circle cx="900" cy="160" r="7" fill="#8a6a2f" />
  <text x="900" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#1f1d1a">2026</text>
  <text x="900" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.75">
    <tspan x="900" dy="0">Both October 4 and</tspan>
    <tspan x="900" dy="15">October 6 still</tspan>
    <tspan x="900" dy="15">circulate online</tspan>
  </text>

  <text x="500" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f1d1a" opacity="0.55">
    <tspan x="500" dy="0">Blue marks attempts that faded out, green marks the brand press release that stuck, red marks the</tspan>
    <tspan x="500" dy="18">registrar's own actions, and gold marks where things stand today: both dates still circulate.</tspan>
  </text>
</svg>
