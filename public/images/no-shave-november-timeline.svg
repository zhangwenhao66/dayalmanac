<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Timeline of No-Shave November, 2007 to 2024</title>
  <desc id="desc">2007: Matthew Hill of the Chicago area dies of colon cancer. 2009: his family starts a Facebook campaign called No-Shave November. 2013: the campaign partners with the American Cancer Society. 2015: the Matthew Hill Foundation, Inc. is formed to run it. 2024: the campaign moves to Fight Colorectal Cancer.</desc>
  <rect width="1200" height="630" fill="#faf7f0" />

  <text x="600" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1f1d1a">No-Shave November, from a Facebook page to a nonprofit</text>
  <text x="600" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1f1d1a" opacity="0.6">A family tribute, not a federal designation</text>

  <line x1="90" y1="330" x2="1110" y2="330" stroke="#e2dbcc" stroke-width="2" />

  <!-- 2007 -->
  <circle cx="150" cy="330" r="8" fill="#8a8471" />
  <text x="150" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#1f1d1a">2007</text>
  <text x="150" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">
    <tspan x="150" dy="0">Matthew Hill, of the</tspan>
    <tspan x="150" dy="18">Chicago area, dies</tspan>
    <tspan x="150" dy="18">of colon cancer</tspan>
  </text>

  <!-- 2009 -->
  <circle cx="390" cy="330" r="8" fill="#5b6d45" />
  <text x="390" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#1f1d1a">2009</text>
  <text x="390" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">
    <tspan x="390" dy="0">His children launch</tspan>
    <tspan x="390" dy="18">No-Shave November</tspan>
    <tspan x="390" dy="18">as a Facebook page</tspan>
  </text>

  <!-- 2013 -->
  <circle cx="630" cy="330" r="8" fill="#5b6d45" />
  <text x="630" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#1f1d1a">2013</text>
  <text x="630" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">
    <tspan x="630" dy="0">The campaign</tspan>
    <tspan x="630" dy="18">partners with the</tspan>
    <tspan x="630" dy="18">American Cancer Society</tspan>
  </text>

  <!-- 2015 -->
  <circle cx="870" cy="330" r="8" fill="#2f4858" />
  <text x="870" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#1f1d1a">2015</text>
  <text x="870" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">
    <tspan x="870" dy="0">The Matthew Hill</tspan>
    <tspan x="870" dy="18">Foundation, Inc. forms</tspan>
    <tspan x="870" dy="18">to run the campaign</tspan>
  </text>

  <!-- 2024 -->
  <circle cx="1110" cy="330" r="8" fill="#2f4858" />
  <text x="1090" y="290" text-anchor="end" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#1f1d1a">2024</text>
  <text x="1090" y="365" text-anchor="end" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.75">
    <tspan x="1090" dy="0" text-anchor="end">The campaign moves</tspan>
    <tspan x="1090" dy="18" text-anchor="end">to Fight Colorectal</tspan>
    <tspan x="1090" dy="18" text-anchor="end">Cancer (Fight CRC)</tspan>
  </text>

  <text x="600" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.55">
    <tspan x="600" dy="0">Gray marks the personal loss that started it; green marks the Hill family's own steps; navy marks the campaign's</tspan>
    <tspan x="600" dy="20">later moves into formal nonprofit partners. No federal proclamation or standing law appears anywhere on this timeline.</tspan>
  </text>
</svg>
