<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Timeline of Ovarian Cancer Awareness Month, 1998 to 2025</title>
  <desc id="desc">1998: President Clinton proclaims National Ovarian Cancer Awareness Week for September 13 through 19. 2000: the National Ovarian Cancer Coalition expands the observance into a full National Ovarian Cancer Awareness Month. 2002: the earliest full-month presidential proclamation confirmed on the record, Proclamation 7587, is issued for September 2002. 2023: the House introduces H.Res.746 supporting the designation, one of several such resolutions that have been introduced without becoming law. 2025: the White House marks the month with a presidential message rather than a numbered proclamation, a format change from prior years.</desc>
  <rect width="1200" height="400" fill="#faf7f0" />

  <text x="600" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#1f1d1a">A presidential week, then a nonprofit's month</text>

  <line x1="55" y1="210" x2="1145" y2="210" stroke="#e2dbcc" stroke-width="2" />

  <!-- 1998 -->
  <circle cx="100" cy="210" r="8" fill="#3f6b5e" />
  <text x="100" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="600" fill="#1f1d1a">1998</text>
  <text x="100" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#1f1d1a" opacity="0.78">
    <tspan x="100" dy="0">Clinton proclaims a</tspan>
    <tspan x="100" dy="16">single Awareness</tspan>
    <tspan x="100" dy="16">Week, Sept. 13-19</tspan>
  </text>

  <!-- 2000 -->
  <circle cx="330" cy="210" r="8" fill="#3f6b5e" />
  <text x="330" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="600" fill="#1f1d1a">2000</text>
  <text x="330" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#1f1d1a" opacity="0.78">
    <tspan x="330" dy="0">NOCC expands the</tspan>
    <tspan x="330" dy="16">week into a full</tspan>
    <tspan x="330" dy="16">national month</tspan>
  </text>

  <!-- 2002 -->
  <circle cx="560" cy="210" r="8" fill="#8a6d3b" />
  <text x="560" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="600" fill="#1f1d1a">2002</text>
  <text x="560" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#1f1d1a" opacity="0.78">
    <tspan x="560" dy="0">Earliest full-month</tspan>
    <tspan x="560" dy="16">proclamation found</tspan>
    <tspan x="560" dy="16">on the record</tspan>
  </text>

  <!-- 2023 -->
  <circle cx="820" cy="210" r="8" fill="#a8352b" />
  <text x="820" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="600" fill="#1f1d1a">2023</text>
  <text x="820" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#1f1d1a" opacity="0.78">
    <tspan x="820" dy="0">H.Res.746 introduced;</tspan>
    <tspan x="820" dy="16">no such resolution</tspan>
    <tspan x="820" dy="16">has become law</tspan>
  </text>

  <!-- 2025 -->
  <circle cx="1080" cy="210" r="8" fill="#a8352b" />
  <text x="1080" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="600" fill="#1f1d1a">2025</text>
  <text x="1080" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#1f1d1a" opacity="0.78">
    <tspan x="1080" dy="0">White House issues a</tspan>
    <tspan x="1080" dy="16">message, not a</tspan>
    <tspan x="1080" dy="16">numbered proclamation</tspan>
  </text>

  <text x="600" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1f1d1a" opacity="0.6">No single act of Congress has ever made the month a standing, self-renewing designation</text>
</svg>
