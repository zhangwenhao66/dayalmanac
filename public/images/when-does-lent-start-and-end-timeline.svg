<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Timeline of the 2026 Lent season">
<rect width="800" height="300" fill="#faf6ee"/>
<text x="40" y="44" font-family="Georgia,serif" font-size="22" fill="#2f4858">Lent 2026: where the season ends depends on the church</text>
<line x1="60" y1="150" x2="740" y2="150" stroke="#2f4858" stroke-width="3"/>
<g font-family="Georgia,serif" fill="#2f4858" text-anchor="middle">
<circle cx="80" cy="150" r="9" fill="#a8352b"/><text x="80" y="122" font-size="15">Ash Wednesday</text><text x="80" y="182" font-size="15">Feb 18</text>
<circle cx="480" cy="150" r="9" fill="#8a6a2f"/><text x="480" y="122" font-size="15">Holy Thursday</text><text x="480" y="182" font-size="15">Apr 2</text>
<circle cx="590" cy="150" r="9" fill="#5b6d45"/><text x="590" y="122" font-size="15">Holy Saturday</text><text x="590" y="182" font-size="15">Apr 4</text>
<circle cx="700" cy="150" r="9" fill="#6d4470"/><text x="700" y="122" font-size="15">Easter Sunday</text><text x="700" y="182" font-size="15">Apr 5</text>
</g>
<g font-family="Georgia,serif" font-size="14" fill="#2f4858">
<path d="M80 215 H480" stroke="#8a6a2f" stroke-width="4"/><text x="80" y="242">Catholic norms: Lent ends before the Evening Mass of the Lord's Supper</text>
<path d="M80 262 H590" stroke="#5b6d45" stroke-width="4"/><text x="80" y="286">Many Anglican, Lutheran, Methodist, Reformed churches: through Holy Saturday</text>
</g></svg>
