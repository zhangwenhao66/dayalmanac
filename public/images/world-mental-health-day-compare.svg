<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Three mental-health observances inside six weeks, three different founders</title>
  <desc id="desc">September 10: World Suicide Prevention Day, created in 2003 by the International Association for Suicide Prevention and the World Health Organization. First full week of October: Mental Illness Awareness Week, established in 1990 by the U.S. National Alliance on Mental Illness, a United States-only observance. October 10: World Mental Health Day, first observed in 1992 at the initiative of the World Federation for Mental Health's then Deputy Secretary General Richard Hunter, a worldwide observance. All three sit inside the same six-week span every year but were founded by three separate organizations in three separate years.</desc>
  <rect width="1200" height="640" fill="#f5f3ee" />

  <text x="600" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#1f1d1a">Three mental-health dates, six weeks, three founders</text>
  <text x="600" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f1d1a" opacity="0.65">Easy to conflate — none of them share an organization, a founding year, or even a country of origin</text>

  <line x1="90" y1="330" x2="1110" y2="330" stroke="#d6d0c4" stroke-width="3" />

  <!-- Sept 10 -->
  <circle cx="220" cy="330" r="9" fill="#a8352b" />
  <text x="220" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#1f1d1a">Sept. 10</text>
  <text x="220" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#1f1d1a" opacity="0.85">
    <tspan x="220" dy="0">World Suicide</tspan>
    <tspan x="220" dy="15">Prevention Day</tspan>
    <tspan x="220" dy="20" font-weight="700">Founded 2003</tspan>
    <tspan x="220" dy="15">IASP + WHO</tspan>
  </text>

  <!-- First full week of Oct -->
  <circle cx="600" cy="330" r="9" fill="#5b6d45" />
  <text x="600" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1f1d1a">
    <tspan x="600" dy="0">First full week</tspan>
    <tspan x="600" dy="20">of October</tspan>
  </text>
  <text x="600" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#1f1d1a" opacity="0.85">
    <tspan x="600" dy="0">Mental Illness</tspan>
    <tspan x="600" dy="15">Awareness Week</tspan>
    <tspan x="600" dy="20" font-weight="700">Founded 1990</tspan>
    <tspan x="600" dy="15">NAMI — U.S. only</tspan>
  </text>

  <!-- Oct 10 -->
  <circle cx="980" cy="330" r="9" fill="#2f4858" />
  <text x="980" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#1f1d1a">Oct. 10</text>
  <text x="980" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#1f1d1a" opacity="0.85">
    <tspan x="980" dy="0">World Mental</tspan>
    <tspan x="980" dy="15">Health Day</tspan>
    <tspan x="980" dy="20" font-weight="700">Founded 1992</tspan>
    <tspan x="980" dy="15">WFMH — worldwide</tspan>
  </text>

  <rect x="90" y="500" width="1020" height="100" rx="10" fill="#ffffff" stroke="#d6d0c4" stroke-width="1.5" />
  <text x="600" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1f1d1a">What actually distinguishes them</text>
  <text x="600" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1f1d1a" opacity="0.8">World Suicide Prevention Day targets one specific outcome; Mental Illness Awareness Week is a U.S. advocacy campaign</text>
  <text x="600" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1f1d1a" opacity="0.8">covering mental illness broadly; World Mental Health Day is the oldest and the only one of the three observed worldwide</text>
</svg>
